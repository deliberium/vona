[package]
name = "vona-moshi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Kyutai Moshi backend for vona — full-duplex STS via WebSocket, no Python runtime required"

# System prerequisites:
#   macOS:  brew install opus
#   Linux:  apt install libopus-dev pkg-config
#   (the `opus` crate links against libopus via pkg-config)

[dependencies]
vona           = { path = "../vona" }
async-trait    = "0.1"
byteorder      = "1"
futures-util   = "0.3"
native-tls     = "0.2"
ogg            = { version = "0.9", features = ["async"] }
opus           = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "1"
tokio          = { version = "1", features = ["rt", "sync", "io-util", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["native-tls", "connect"] }
tracing        = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
