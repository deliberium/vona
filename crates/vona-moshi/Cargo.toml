[package]
name = "vona-moshi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Kyutai Moshi backend for vona — full-duplex STS via WebSocket, no Python runtime required"
documentation = "https://docs.rs/vona-moshi"

# System prerequisites:
#   macOS:  brew install opus
#   Linux:  apt install libopus-dev pkg-config
#   (the `opus` crate links against libopus via pkg-config)

[dependencies]
vona-core.workspace = true
async-trait.workspace = true
byteorder.workspace = true
futures-util.workspace = true
native-tls.workspace = true
ogg.workspace = true
opus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "net"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
