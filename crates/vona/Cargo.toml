[package]
name = "vona"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Umbrella crate for Vona real-time speech-to-speech runtime contracts and optional adapters"
documentation = "https://docs.rs/vona"

[lib]
name = "vona"
path = "src/lib.rs"

[[example]]
name = "mlx_ollama_voice_bench"
path = "examples/mlx_ollama_voice_bench.rs"
required-features = ["mlx-qwen3-tts-native", "mlx-whisper-native", "ollama"]

[features]
default = []
all = [
    "azure-speech",
    "cloud",
    "deepgram",
    "elevenlabs",
    "gemini-live",
    "model-provisioning",
    "moshi",
    "mlx",
    "mlx-models-loader",
    "mlx-qwen3-tts",
    "mlx-whisper",
    "ollama",
    "openai-realtime",
    "qwen",
    "seamless",
    "test-harness",
    "transport-local",
]
cloud = [
    "azure-speech",
    "deepgram",
    "elevenlabs",
    "gemini-live",
    "openai-realtime",
    "qwen",
]
seamless = ["dep:vona-seamless"]
moshi = ["dep:vona-moshi"]
mlx = ["dep:vona-mlx"]
mlx-models-loader = ["mlx", "vona-mlx/mlx-models-loader"]
mlx-whisper = ["mlx", "dep:vona-mlx-whisper"]
mlx-qwen3-tts = ["mlx", "dep:vona-mlx-qwen3-tts"]
mlx-native = ["mlx", "vona-mlx/native-mlx"]
mlx-whisper-native = ["mlx-whisper", "mlx-native", "vona-mlx-whisper/native-mlx"]
mlx-qwen3-tts-native = ["mlx-qwen3-tts", "mlx-native", "vona-mlx-qwen3-tts/native-mlx"]
ollama = ["dep:vona-ollama"]
transport-local = ["seamless", "dep:vona-transport-local"]
test-harness = ["dep:vona-test-harness"]
openai-realtime = ["dep:vona-openai-realtime"]
qwen = ["dep:vona-qwen"]
gemini-live = ["dep:vona-gemini-live"]
elevenlabs = ["dep:vona-elevenlabs"]
deepgram = ["dep:vona-deepgram"]
azure-speech = ["dep:vona-azure-speech"]
model-provisioning = ["dep:vona-model-provisioning"]

[dependencies]
vona-core.workspace = true
vona-azure-speech = { workspace = true, optional = true }
vona-deepgram = { workspace = true, optional = true }
vona-elevenlabs = { workspace = true, optional = true }
vona-gemini-live = { workspace = true, optional = true }
vona-model-provisioning = { workspace = true, optional = true }
vona-moshi = { workspace = true, optional = true }
vona-mlx = { workspace = true, optional = true }
vona-mlx-qwen3-tts = { workspace = true, optional = true }
vona-mlx-whisper = { workspace = true, optional = true }
vona-ollama = { workspace = true, optional = true }
vona-openai-realtime = { workspace = true, optional = true }
vona-qwen = { workspace = true, optional = true }
vona-seamless = { workspace = true, optional = true }
vona-test-harness = { workspace = true, optional = true }
vona-transport-local = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
