[package]
name = "vona-mlx-whisper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native MLX Whisper speech recognition loader for Vona"
documentation = "https://docs.rs/vona-mlx-whisper"

[lib]
name = "vona_mlx_whisper"
path = "src/lib.rs"

[[example]]
name = "whisper_smoke"
path = "examples/whisper_smoke.rs"

[features]
default = []
native-mlx = [
    "dep:mlx-rs",
    "dep:tokenizers",
    "vona-mlx/native-mlx",
    "vona-mlx-speech/native-mlx",
]

[dependencies]
mlx-rs = { workspace = true, optional = true }
serde.workspace = true
tokenizers = { workspace = true, optional = true }
vona-mlx.workspace = true
vona-mlx-speech.workspace = true
