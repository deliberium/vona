[package]
name = "vona-mlx-whisper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native MLX Whisper speech recognition loader for Vona"
documentation = "https://docs.rs/vona-mlx-whisper"

[lib]
name = "vona_mlx_whisper"
path = "src/lib.rs"

[[example]]
name = "whisper_smoke"
path = "examples/whisper_smoke.rs"

[[bin]]
name = "vona_mlx_whisper_worker"
path = "src/bin/vona_mlx_whisper_worker.rs"
required-features = ["native-mlx"]

[features]
default = []
native-mlx = [
    "dep:mlx-rs",
    "dep:tokenizers",
    "vona-mlx/native-mlx",
    "vona-mlx-speech/native-mlx",
]

[dependencies]
async-trait.workspace = true
mlx-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt", "sync"] }
tokenizers = { workspace = true, optional = true }
vona-core.workspace = true
vona-mlx.workspace = true
vona-mlx-speech.workspace = true
