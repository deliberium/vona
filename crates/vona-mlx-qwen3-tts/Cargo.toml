[package]
name = "vona-mlx-qwen3-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native MLX Qwen3 TTS loader for Vona"
documentation = "https://docs.rs/vona-mlx-qwen3-tts"

[lib]
name = "vona_mlx_qwen3_tts"
path = "src/lib.rs"

[[example]]
name = "qwen3_tts_smoke"
path = "examples/qwen3_tts_smoke.rs"

[features]
default = []
native-mlx = [
    "dep:mlx-rs",
    "dep:tokenizers",
    "vona-mlx/native-mlx",
    "vona-mlx-speech/native-mlx",
]

[dependencies]
mlx-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokenizers = { workspace = true, optional = true }
vona-mlx.workspace = true
vona-mlx-speech.workspace = true
