<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vona Wake architecture</title>
  <desc id="desc">Architecture diagram showing microphone audio moving through signal preparation, phrase detection, optional speaker verification, policy gating, and transport release.</desc>
  <defs>
    <radialGradient id="cyan-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(365 236) rotate(38) scale(620 360)">
      <stop stop-color="#16DBE5" stop-opacity="0.30"/>
      <stop offset="0.58" stop-color="#16DBE5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#16DBE5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 620) rotate(-128) scale(560 330)">
      <stop stop-color="#FF9D12" stop-opacity="0.24"/>
      <stop offset="0.58" stop-color="#FF9D12" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF9D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="86" y1="74" x2="1354" y2="828" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2234"/>
      <stop offset="0.52" stop-color="#071421"/>
      <stop offset="1" stop-color="#03050B"/>
    </linearGradient>
    <linearGradient id="rail" x1="154" y1="414" x2="1286" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16DBE5"/>
      <stop offset="0.55" stop-color="#8DF7FB"/>
      <stop offset="1" stop-color="#FF9D12"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#113648"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <linearGradient id="node-hot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#153944"/>
      <stop offset="1" stop-color="#35220A"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-24%" width="136%" height="148%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#16DBE5" flood-opacity="0.07"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#B9F8FA" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .eyebrow { fill: #16DBE5; font-family: JetBrains Mono, Menlo, monospace; font-size: 15px; font-weight: 800; letter-spacing: 0.18em; }
      .title { fill: #FFFFFF; font-family: Outfit, Inter, Arial, sans-serif; font-size: 54px; font-weight: 800; letter-spacing: 0; }
      .copy { fill: rgba(247, 251, 255, 0.64); font-family: Outfit, Inter, Arial, sans-serif; font-size: 19px; font-weight: 400; letter-spacing: 0; }
      .label { fill: #F7FBFF; font-family: Outfit, Inter, Arial, sans-serif; font-size: 25px; font-weight: 800; letter-spacing: 0; }
      .small { fill: rgba(247, 251, 255, 0.70); font-family: JetBrains Mono, Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; }
      .micro { fill: rgba(247, 251, 255, 0.52); font-family: JetBrains Mono, Menlo, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
      .flow-text { fill: rgba(247, 251, 255, 0.62); font-family: Outfit, Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0; }
      .panel-title { fill: #FFFFFF; font-family: Outfit, Inter, Arial, sans-serif; font-size: 21px; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#040912"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect width="1440" height="900" fill="url(#cyan-halo)"/>
  <rect width="1440" height="900" fill="url(#orange-halo)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="74" width="1268" height="754" rx="34" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <path d="M126 176C285 112 392 232 540 188C682 145 734 97 884 134C1034 171 1166 118 1312 164" stroke="#16DBE5" stroke-opacity="0.13" stroke-width="2"/>
    <path d="M130 738C308 688 382 758 548 710C694 668 758 760 930 706C1096 654 1170 724 1310 670" stroke="#FF9D12" stroke-opacity="0.13" stroke-width="2"/>
  </g>

  <image href="VonaLogo.png" x="1126" y="118" width="116" height="116" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="1184" cy="176" r="74" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="1184" cy="176" r="58" stroke="#16DBE5" stroke-opacity="0.22"/>

  <text x="150" y="145" class="eyebrow">VONA WAKE</text>
  <text x="150" y="210" class="title">Admission, not recognition.</text>
  <text x="151" y="252" class="copy">A standalone wake admission layer that keeps audio local until detection, identity, policy, and timing agree.</text>

  <path d="M154 414H1286" stroke="url(#rail)" stroke-width="5" stroke-linecap="round"/>
  <path d="M154 414H1286" stroke="url(#rail)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.08"/>
  <circle cx="154" cy="414" r="9" fill="#16DBE5"/>
  <circle cx="1286" cy="414" r="9" fill="#FF9D12"/>

  <g transform="translate(122 326)">
    <rect width="144" height="176" rx="22" fill="#071421" stroke="#16DBE5" stroke-opacity="0.28"/>
    <text x="72" y="42" text-anchor="middle" class="micro">MIC STREAM</text>
    <path d="M72 68C72 56 82 46 94 46C106 46 116 56 116 68V99C116 112 106 122 94 122C82 122 72 112 72 99V68Z" fill="#16DBE5" fill-opacity="0.14" stroke="#16DBE5" stroke-opacity="0.82"/>
    <path d="M48 95C48 120 68 140 94 140C120 140 140 120 140 95" stroke="#FF9D12" stroke-width="4" stroke-linecap="round"/>
    <path d="M94 140V158M74 158H114" stroke="#F7FBFF" stroke-opacity="0.54" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(298 300)">
    <rect width="190" height="228" rx="24" fill="url(#node)" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="24" y="42" class="small">01</text>
    <text x="24" y="80" class="label">Signal</text>
    <text x="24" y="112" class="label">forge</text>
    <text x="24" y="154" class="micro">ENERGY</text>
    <text x="24" y="179" class="micro">SPECTRAL SHAPE</text>
    <text x="24" y="204" class="micro">PRE-ROLL RING</text>
    <path d="M138 58C126 92 146 114 124 144C109 165 111 186 132 204" stroke="#16DBE5" stroke-width="5" stroke-linecap="round"/>
    <path d="M156 58C144 92 164 114 142 144C127 165 129 186 150 204" stroke="#FF9D12" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(518 300)">
    <rect width="190" height="228" rx="24" fill="url(#node)" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="24" y="42" class="small">02</text>
    <text x="24" y="80" class="label">Phrase</text>
    <text x="24" y="112" class="label">lattice</text>
    <text x="24" y="154" class="micro">MULTI-PHRASE</text>
    <text x="24" y="179" class="micro">NEAR-MISS REJECT</text>
    <text x="24" y="204" class="micro">THRESHOLD SWEEP</text>
    <circle cx="138" cy="72" r="16" fill="#16DBE5" fill-opacity="0.16" stroke="#16DBE5"/>
    <circle cx="112" cy="130" r="16" fill="#FF9D12" fill-opacity="0.16" stroke="#FF9D12"/>
    <circle cx="154" cy="178" r="16" fill="#16DBE5" fill-opacity="0.16" stroke="#16DBE5"/>
    <path d="M132 87L119 115M124 141L144 164M144 87L151 162" stroke="#F7FBFF" stroke-opacity="0.34" stroke-width="3"/>
  </g>

  <g transform="translate(738 300)">
    <rect width="190" height="228" rx="24" fill="url(#node)" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="24" y="42" class="small">03</text>
    <text x="24" y="80" class="label">Speaker</text>
    <text x="24" y="112" class="label">lock</text>
    <text x="24" y="154" class="micro">OPTIONAL PROFILE</text>
    <text x="24" y="179" class="micro">APP-OWNED KEYS</text>
    <text x="24" y="204" class="micro">GUEST REJECTION</text>
    <circle cx="136" cy="88" r="32" fill="#16DBE5" fill-opacity="0.12" stroke="#16DBE5"/>
    <path d="M121 88C121 80 128 73 136 73C145 73 152 80 152 88C152 97 145 104 136 104C128 104 121 97 121 88Z" fill="#F7FBFF" fill-opacity="0.78"/>
    <path d="M105 145C112 130 123 124 136 124C149 124 160 130 167 145" stroke="#FF9D12" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(958 300)">
    <rect width="190" height="228" rx="24" fill="url(#node-hot)" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="24" y="42" class="small">04</text>
    <text x="24" y="80" class="label">Policy</text>
    <text x="24" y="112" class="label">gate</text>
    <text x="24" y="154" class="micro">PRIVACY MODE</text>
    <text x="24" y="179" class="micro">BARGE-IN</text>
    <text x="24" y="204" class="micro">COOLDOWN</text>
    <path d="M138 58L168 76V117C168 153 149 177 138 186C126 177 106 153 106 117V76L138 58Z" fill="#FF9D12" fill-opacity="0.15" stroke="#FF9D12" stroke-width="3"/>
    <path d="M124 116L135 128L154 100" stroke="#16DBE5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1180 326)">
    <rect width="138" height="176" rx="22" fill="#071421" stroke="#FF9D12" stroke-opacity="0.34"/>
    <text x="69" y="42" text-anchor="middle" class="micro">SESSION</text>
    <path d="M34 74H104V118H34V74Z" fill="#16DBE5" fill-opacity="0.12" stroke="#16DBE5"/>
    <path d="M50 91H88M50 106H76" stroke="#F7FBFF" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round"/>
    <path d="M69 118V143M49 143H89" stroke="#FF9D12" stroke-width="4" stroke-linecap="round"/>
    <text x="69" y="162" text-anchor="middle" class="micro">FRAMES OPEN</text>
  </g>

  <g transform="translate(150 612)">
    <rect width="1140" height="148" rx="24" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="34" y="42" class="panel-title">WakeGate state machine</text>
    <text x="34" y="78" class="flow-text">
      <tspan x="34" dy="0">Dormant frames accumulate pre-roll; candidate evidence is scored;</tspan>
      <tspan x="34" dy="26">accepted events release buffered audio; suppressed states protect policy.</tspan>
    </text>
    <text x="760" y="42" class="panel-title">Evidence loop</text>
    <text x="760" y="78" class="flow-text">
      <tspan x="760" dy="0">Generated regression catches logic drift.</tspan>
      <tspan x="760" dy="26">Human-recorded corpora prove reliability.</tspan>
    </text>
  </g>

  <g transform="translate(150 802)">
    <rect width="1140" height="1" fill="url(#rail)" opacity="0.55"/>
    <text x="0" y="34" class="micro">
      <tspan x="0" dy="0">RUST HOT PATH · LOCAL AUDIO ADMISSION · APPLICATION-OWNED ENROLLMENT</tspan>
      <tspan x="0" dy="24">MODEL-RUNTIME AGNOSTIC DETECTORS · RELEASE-GRADE REAL-VOICE EVIDENCE</tspan>
    </text>
  </g>
</svg>
