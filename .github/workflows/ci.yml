name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs') }}
          restore-keys: |
            cargo-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-build-${{ runner.os }}-

      - name: Run release gate
        run: bash scripts/release_gate.sh

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-transport-bench
          path: target/release-gate-transport-bench.log
          if-no-files-found: warn
