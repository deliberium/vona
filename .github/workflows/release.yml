name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semantic version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - current
          - patch
          - minor
          - major
      publish:
        description: "Publish crates to crates.io"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release Vona Crates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Prepare release metadata and gate
        run: scripts/release_crates.sh --release "${{ inputs.release_type }}" --bootstrap ${{ inputs.publish && '--skip-package-dry-run' || '' }}

      - name: Read release version
        id: version
        run: echo "version=$(cat target/vona-release-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md docs/benchmark-results.md
          git commit -m "Release v${{ steps.version.outputs.version }}" || true
          git tag "v${{ steps.version.outputs.version }}"

      - name: Publish crates
        if: ${{ inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/release_crates.sh --release current --skip-gate --publish --skip-published

      - name: Push release commit and tag
        if: ${{ inputs.publish }}
        run: |
          git push origin HEAD
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
